<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f6eb"><meta name="description" content="シギッチといっしょに、自然・食べもの・水・ごみのひみつを見つけよう！小学生のためのイラストクイズ。">
  <title>シギッチクイズ｜しぜんの ふしぎを みつけよう</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar"><a href="./" class="brand" aria-label="シギッチクイズのホーム"><img src="assets/icon.svg" alt="" width="38" height="38">シギッチクイズ</a><div class="tools"><button id="sound" class="small" aria-pressed="false">音：オフ</button><button id="help" class="small" aria-label="あそびかた">？</button></div></header>
  <main id="app"><div class="loading">シギッチが じゅんびしているよ…</div></main>
  <footer><span>しぜんの「なぜ？」が、たからもの。</span><a href="teacher.html">先生・保護者の方へ</a></footer>
  <dialog id="help-dialog"><button class="close small" aria-label="とじる">×</button><p class="eyebrow">HOW TO PLAY</p><h2>あそびかた</h2><ol><li>「クイズをはじめる」をタッチ。</li><li>絵と問題を見て、答えを1つえらぼう。</li><li>答えと解説を読んで、つぎの問題へ。</li><li>さいごに、点数とふりかえりが見られるよ！</li></ol><p>時間のせいげんはないよ。ゆっくり考えてね。</p><button class="primary close">わかった！</button></dialog>
  <dialog id="exit-dialog"><h2>いったん、おやすみする？</h2><p>ホームに戻ると、今のチャレンジは最初からになるよ。</p><button class="primary" id="stay">つづける</button><button class="secondary" id="leave">ホームに戻る</button></dialog>
</body></html>
